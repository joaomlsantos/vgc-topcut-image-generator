[project]
name = "vgc-topcut-image-generator"
version = "0.1.0"
description = "VGC Top Cut Image Generator API"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "beautifulsoup4==4.11.1",
    "fastapi[standard]==0.142.2",
    "Pillow==11.3.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.13.5",
    "python-dotenv==1.1.1",
    "requests==2.32.4",
    "transformers==4.53.0",
]

[tool.fastapi]
entrypoint = "src.api:app"
